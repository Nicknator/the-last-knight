<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyebound</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="icon" type="image/png"href="img/favicon/favicon1.png">
    <link rel="stylesheet" href="style.css">
    <script src="modals/drawable-object.class.js"></script>
    <script src="modals/movable-object.class.js"></script>
    <script src="modals/statusbar-health.class.js"></script>
    <script src="modals/statusbar-ammo.class.js"></script>
    <script src="modals/statusbar-coin.class.js"></script>
    <script src="modals/loot-bolt.class.js"></script>
    <script src="modals/coin.class.js"></script>
    <script src="modals/character.class.js"></script>
    <script src="modals/skeleton-enemy.class.js"></script>
    <script src="modals/endboss.class.js"></script>
    <script src="modals/fire-particle.class.js"></script>
    <script src="modals/cloud.class.js"></script>
    <script src="modals/bolt.class.js"></script>
    <script src="modals/sound.class.js"></script>
    <script src="modals/world.class.js"></script>
    <script src="modals/background-object.class.js"></script>
    <script src="modals/keyboard.class.js"></script>
    <script src="modals/level.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>

</head>

<body onload="init()">
    <h1>Skyebound</h1>
    <div id="gameContainer">
        <canvas id="canvas" width="720" height="480"></canvas>
        <div class="ingame-controls-text">
            Left/Right = a/d<br>
            Jump = w<br>
            Block = s <br>
            Attack = e<br>
            Crossbow = f
        </div>
        <img src="img/8_other/mute_on.png" alt="mute" class="img-button mute-button" id="muteBtn"
            onclick="toggleMute()">
        <img src="img/6_button/fsb.png" alt="fsb" class="img-button" onclick="fullScreen()">
    </div>


    <div class="bigStartImg" id="startScreen">
        <img src="img/5_background/winter-location.png" alt="start_img" class="setBigImg">
        <div class="smalStartImg">
            <img src="img/5_background/winter-location2.png" alt="smal_start_img" class="setSmalImg">
            <div class="setInnerArea">
                <img src="img/7_intro_outro_screens/start/start_button.png" alt="start_button" class="setStartBtn"
                    onclick="startGame()">
                <h2>Skyebound</h2>
                <img src="img/7_intro_outro_screens/start/start_knight.png" alt="start_knight"
                    class="setStartKnightImg">
            </div>
        </div>
    </div>


    <div class="gameOverScreen" id="gameOverScreen">
        <img src="img/5_background/winter-location.png" alt="start_img" class="setBigImg">
        <div class="smalStartImg">
            <img src="img/5_background/winter-location.png" alt="smal_start_img" class="setSmalImg">
            <div class="setInnerArea">
                <img src="img/7_intro_outro_screens/start/start_button.png" alt="start_button" class="setStartBtn"
                    onclick="restartGame()">
                <h2>Game Over!</h2>
            </div>
        </div>
    </div>


</body>

</html>
